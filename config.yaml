# Faceless AI Video Studio - config
# Cac API key thuc su nam trong .env (khong commit), file nay chi khai bao lua chon.

script:
  provider: anthropic # anthropic | ollama
  model: claude-sonnet-5
  ollama_model: qwen2.5:7b
  ollama_host: http://localhost:11434

tts:
  provider: kokoro # kokoro | chatterbox
  voice: af_heart
  speed: 1.0

subtitle:
  model_size: base.en # tiny.en | base.en | small.en | medium.en
  burn_in: true

image:
  provider: local # local (mflux FLUX.1-schnell) | fal
  model: schnell
  quantize: 4 # 3|4|5|6|8 bit, 4 la lua chon can bang cho May 16GB RAM
  steps: 4
  width: 1024
  height: 1024
  style_suffix: "cinematic documentary style, natural lighting, high detail, no text, no watermark"
  fal_model: fal-ai/flux/dev

video:
  fps: 30
  resolution: [1920, 1080]
  ken_burns: true
  background_music_volume: 0.15

paths:
  projects_dir: projects
  assets_dir: assets
